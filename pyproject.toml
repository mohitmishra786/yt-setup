[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-studio"
version = "0.1.0"
description = "Local-first YouTube creation pipeline: topic → slides → narrated video → transcript → chapters → SEO → Shorts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "chessMan" }]
keywords = [
    "youtube",
    "tts",
    "whisper",
    "pipeline",
    "video",
    "automation",
    "chatterbox",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "anthropic>=0.40.0",
    "python-pptx>=1.0.2",
    "moviepy>=2.1.1",
    "faster-whisper>=1.1.0",
    "Pillow>=10.4.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rich>=13.8.0",
    "typer>=0.12.5",
    "httpx>=0.27.2",
    "edge-tts>=6.1.12",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
# GPU / heavy local models — install when hardware is ready
voice = [
    # chatterbox-tts: install from git when ready for Phase 2
    # "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git",
]
transcribe = [
    # whisperx: pin carefully; needs torch + CUDA for best performance
    # "whisperx>=3.1.1",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "types-Pillow>=10.2.0",
]
all = [
    "yt-studio[web,dev]",
]

[project.scripts]
yt-studio = "cli:app"

[project.urls]
Homepage = "https://github.com/mohitmishra786/yt-setup"
Repository = "https://github.com/mohitmishra786/yt-setup"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "web_ui*"]
exclude = ["tests*", "projects*", "docs*"]

[tool.setuptools.package-data]
"modules.scriptwriter" = ["prompts/*.md"]
"modules.slidebuilder" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: needs external services or heavy deps",
    "gpu: needs CUDA GPU",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "modules", "tests", "web_ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["core", "modules"]
mypy_path = "."
